apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pos-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - restaurant-pos.com
    - api.restaurant-pos.com
    secretName: pos-tls
  rules:
  - host: restaurant-pos.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pos-frontend-service
            port:
              number: 3000
  - host: api.restaurant-pos.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pos-backend-service
            port:
              number: 3001
